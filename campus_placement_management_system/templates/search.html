<!DOCTYPE html>
<html>
<head>
    <title>Campus Placement Management System</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        input { display: block; margin: 8px 0; padding: 8px; width: 250px; }
        button { padding: 10px 20px; background: blue; color: white; border: none; cursor: pointer; }
        .error { color: red; }
    </style>
</head>
<body>

    <h2>Campus Placement Management System</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form action="/search" method="POST">

        <label>Register Number:</label>
        <input type="text" name="regno" placeholder="e.g. 23MSC001">

        <label>Student Name:</label>
        <input type="text" name="name" placeholder="e.g. Asfaaq">

        <label>Department:</label>
        <input type="text" name="department" placeholder="e.g. AI & DS">

        <label>CGPA:</label>
        <input type="number" step="0.1" name="cgpa" placeholder="e.g. 8.5">

        <button type="submit">Check Eligibility</button>

    </form>

</body>
</html>
